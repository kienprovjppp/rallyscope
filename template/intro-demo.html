<title>RallyScope Intro Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
/* Demo of the new intro on a copy of the landing page. Single dark theme, same tokens as template/index.html. */
:root{
  color-scheme: dark;
  --bg:#04080F; --panel:#07111D; --panel-2:#0A1828; --line:#14283D; --line-2:#21405E;
  --ink:#E2EEF8; --ink-2:#9DB4C9; --ink-3:#6C869F;
  --cyan:#4DE3FF; --amber:#FFC857; --white:#FFFFFF;
  --f-display:"Chakra Petch",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --f-body:"Noto Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.brand{display:flex;align-items:center;gap:14px}
.brand b{font:700 30px/1 var(--f-display);letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 14px rgba(77,227,255,.55)}
.brand small{display:block;font:500 12px/1 var(--f-mono);letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase;margin-top:6px}

/* ---------- landing (copied from template/index.html) ---------- */
#landing{min-height:100vh;display:grid;place-items:center;padding:48px 16px;
  background:radial-gradient(ellipse 70% 55% at 50% 38%,rgba(77,227,255,.09),transparent 70%),
    linear-gradient(rgba(77,227,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(77,227,255,.028) 1px,transparent 1px);background-size:auto,40px 40px,40px 40px}
#landing{position:relative;isolation:isolate;--dim-c:.45;--dim-e:.8}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:0;transition:opacity 1s ease;pointer-events:none}
#landing.has-bg .bgv{opacity:1}
#landing.has-bg:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 75% 65% at 50% 45%,rgba(4,8,15,var(--dim-c)),rgba(4,8,15,var(--dim-e))),
    linear-gradient(rgba(77,227,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(77,227,255,.035) 1px,transparent 1px);background-size:auto,40px 40px,40px 40px}
.land{width:100%;max-width:760px;display:grid;gap:28px;justify-items:center;text-align:center}
.land .brand{text-align:left}
.land h1{margin:0;font:700 clamp(28px,5vw,44px)/1.12 var(--f-display);letter-spacing:.02em;color:var(--white);text-wrap:balance}
.land h1 em{font-style:normal;color:var(--cyan);text-shadow:0 0 18px rgba(77,227,255,.45)}
.land .sub{margin:-12px 0 0;font:400 16px/1.55 var(--f-body);color:var(--ink-2);max-width:56ch}
#drop{position:relative;width:100%;display:grid;gap:12px;justify-items:center;padding:56px 24px;cursor:pointer;border-radius:22px;
  background:rgba(7,17,29,.82);border:1.5px dashed var(--line-2);transition:border-color .2s,background .2s,transform .2s}
#drop:before,#drop:after{content:"";position:absolute;width:30px;height:30px;border:2px solid var(--amber)}
#drop:before{left:-5px;top:-5px;border-right:0;border-bottom:0;border-top-left-radius:26px}
#drop:after{right:-5px;bottom:-5px;border-left:0;border-top:0;border-bottom-right-radius:26px}
#drop:hover,#drop.over{border-color:var(--amber);background:rgba(255,200,87,.06)}
#drop svg{color:var(--amber);filter:drop-shadow(0 0 10px rgba(255,200,87,.45))}
#drop b{font:700 22px/1.2 var(--f-display);letter-spacing:.04em;color:var(--white)}
#drop span{font:400 15px/1.5 var(--f-body);color:var(--ink-2)}
#drop .btn{margin-top:8px;border-radius:12px;display:inline-flex;align-items:center;height:42px;padding:0 22px;background:var(--amber);color:#04080F;font:700 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
#drop small{font:500 12px/1.4 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.land .or{display:flex;align-items:center;gap:14px;width:100%;font:600 11px/1 var(--f-display);letter-spacing:.24em;color:var(--ink-3)}
.land .or:before,.land .or:after{content:"";flex:1;height:1px;background:var(--line-2)}
#sampleTile{width:100%;border-radius:16px;display:flex;align-items:center;gap:18px;padding:16px 20px;text-align:left;cursor:pointer;color:var(--ink);
  background:var(--panel);border:1px solid var(--line-2);font:inherit;transition:border-color .2s,background .2s}
#sampleTile:hover{border-color:var(--cyan);background:var(--panel-2)}
#sampleTile .play{flex:none;border-radius:14px;width:52px;height:52px;display:grid;place-items:center;border:1.5px solid var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(77,227,255,.25) inset}
#sampleTile b{display:block;font:700 16px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
#sampleTile span span{display:block;margin-top:5px;font:400 14px/1.45 var(--f-body);color:var(--ink-2)}
.land .priv{font:400 13px/1.5 var(--f-body);color:var(--ink-3);max-width:60ch;margin:0}

/* ---------- intro: the eye opens, the camera dives through the pupil, balls spiral out of the vortex and become the page ---------- */
html.intro-on{overflow:hidden}
#intro{position:fixed;inset:0;z-index:1000;overflow:hidden;cursor:pointer;background:var(--bg)}
#introCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#introSkip{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));
  font:500 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
/* while the page loads: a thin line under the closed eye; a CSS animation, so it stays smooth while the page is busy */
#introLoad{position:absolute;left:50%;top:calc(50% + 64px);width:140px;height:2px;margin-left:-70px;border-radius:1px;overflow:hidden;
  background:rgba(77,227,255,.14);opacity:0;animation:introLoadIn .3s .4s ease-out forwards}
#introLoad:after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#4DE3FF,transparent);animation:introLoadRun 1.1s ease-in-out infinite}
#intro.go #introLoad{display:none}
@keyframes introLoadIn{to{opacity:1}}
@keyframes introLoadRun{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* ---------- demo controls (not part of the intro) ---------- */
#landing{padding-top:110px}
@media (max-width:640px){#landing{padding-top:180px}}
#demoBar{position:fixed;z-index:2000;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(760px,calc(100% - 24px));
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:14px;
  background:rgba(7,17,29,.92);border:1px solid var(--line-2);box-shadow:0 8px 30px rgba(0,0,0,.45)}
#demoBar .lbl{font:600 11px/1 var(--f-display);letter-spacing:.2em;color:var(--amber);text-transform:uppercase;white-space:nowrap}
#demoBar button,#demoBar select{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);
  font:600 12px/1 var(--f-display);letter-spacing:.08em;cursor:pointer}
#demoBar button:hover,#demoBar select:hover{border-color:var(--cyan);color:var(--cyan)}
#demoBar input[type=range]{flex:1 1 180px;min-width:0;accent-color:var(--cyan)}
#demoBar .tm{font:500 12px/1 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
</style>

<div id="intro" aria-hidden="true"><canvas id="introCv"></canvas><i id="introLoad"></i><span id="introSkip">Bấm để bỏ qua</span></div>

<div id="demoBar" role="group" aria-label="Điều khiển bản demo">
  <span class="lbl">Intro mới · demo</span>
  <button id="dReplay" type="button">Phát lại</button>
  <button id="dPause" type="button">Tạm dừng</button>
  <input id="dSeek" type="range" min="0" max="4.2" step="0.01" value="0" aria-label="Tua intro">
  <span id="dTime" class="tm">0.00 s</span>
  <select id="dRate" aria-label="Tốc độ">
    <option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option><option value="0.1">0.1×</option>
  </select>
</div>

<section id="landing"><video id="bgVid" class="bgv" muted loop playsinline preload="auto" aria-hidden="true"></video><div class="land">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="#4DE3FF" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="none" stroke="#FFC857" stroke-width="2"/><path d="M17 0v8M17 26v8M0 17h8M26 17h8" stroke="#4DE3FF" stroke-width="2"/></svg>
    <div><b>RALLYSCOPE</b><small>rally analysis · fixed camera</small></div>
  </div>
  <h1>Play smarter <em>Not Harder</em></h1>
  <p class="sub">Khung xương, đường bóng, tốc độ từng cú đánh và bảng điểm cho 4 người chơi.</p>
  <label id="drop" for="file">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    <b>Kéo thả video vào đây</b>
    <span>hoặc</span>
    <span class="btn">Chọn video</span>
    <small>1 rally · camera đứng yên · thấy trọn sân</small>
  </label>
  <div class="or">HOẶC</div>
  <button id="sampleTile" type="button">
    <span class="play"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg></span>
    <span><b>Xem rally mẫu trước</b><span id="sampleSub">Một rally đã phân tích sẵn (PPA Chicago Cup), để xem kết quả trông như thế nào.</span></span>
  </button>
  <p class="priv">Video chỉ được xử lý ngay trong trình duyệt của bạn, không gửi đi đâu.</p>
</div></section>
<input id="file" type="file" accept="video/*" hidden>

<script>
"use strict";
// Intro: the eye opens and glances aside, the camera dives through the pupil into a vortex, pickleballs spiral
// towards the screen and each one turns into a part of the landing page (logo ring, button, box, text sweep).
// Every pixel is a function of t (seek), so the demo can scrub it. Any click or key outside the demo bar skips it.
(() => {
const intro = document.getElementById("intro"), DEMO = !!document.getElementById("demoBar");
if (!DEMO && (new URLSearchParams(location.search).has("record") || matchMedia("(prefers-reduced-motion: reduce)").matches)) { intro.remove(); return; }
const cv = document.getElementById("introCv");
let x = cv.getContext("2d");   // swapped for a hidden canvas while warming up
const CY = [77, 227, 255], AM = [255, 200, 87], LID = [220, 248, 255], TAU = 2 * Math.PI;
const rgb = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const mix = (a, b, k) => a + (b - a) * k;
const mixC = (p, q, k) => [0, 1, 2, 3].map(i => mix(p[i] ?? 1, q[i] ?? 1, k));
const rgba = c => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${c[3]})`;
const outCubic = k => 1 - Math.pow(1 - cl(k), 3);
const inOutCubic = k => (k = cl(k)) < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outExpo = k => (k = cl(k)) >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const spring = (s, w = 13, z = 0.8) => {   // damped spring, s in seconds: 0 -> 1 with a 1-2 % overshoot
  if (s <= 0) return 0; const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * s) * (Math.cos(wd * s) + z * w / wd * Math.sin(wd * s));
};
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
// seconds; the whole intro is T_END long
const T_OPEN = 0.15, T_OPEN1 = 1.0, T_ZOOM = 1.0, T_ZOOM1 = 2.0, T_FADE = 2.75, T_END = 4.2;
let W = 0, H = 0, dpr = 1, tg = null;
const size = () => { dpr = Math.min(window.devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); tg = null; };
size(); addEventListener("resize", size);

// ---------- static geometry, built once in unit space ----------
const IRIS = (() => {   // iris radius = 1
  const fib = new Path2D(), inner = new Path2D(), coll = new Path2D(), crypt = new Path2D(), furrow = new Path2D();
  for (let i = 0; i < 280; i++) {   // stroma fibres from the collarette to the rim, each slightly bent
    const a = i / 280 * TAU + rnd(i) * 0.02, r0 = 0.47 + 0.05 * rnd(i + 3), r1 = 0.8 + 0.17 * rnd(i + 7), am = a + (rnd(i + 11) - 0.5) * 0.14, rm = (r0 + r1) / 2;
    fib.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); fib.quadraticCurveTo(Math.cos(am) * rm, Math.sin(am) * rm, Math.cos(a) * r1, Math.sin(a) * r1);
  }
  for (let i = 0; i < 140; i++) {   // finer fibres between the pupil and the collarette
    const a = i / 140 * TAU + rnd(i + 50) * 0.03, r0 = 0.27, r1 = 0.43 + 0.05 * rnd(i + 51);
    inner.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); inner.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
  }
  for (let j = 0; j <= 240; j++) {   // the collarette: a wavy ring
    const a = j / 240 * TAU, r = 0.47 + 0.028 * Math.sin(11 * a + 1) + 0.013 * Math.sin(27 * a);
    j ? coll.lineTo(Math.cos(a) * r, Math.sin(a) * r) : coll.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  coll.closePath();
  for (let i = 0; i < 30; i++) {   // crypts: dark lens-shaped pits
    const a = rnd(i + 90) * TAU, r = 0.52 + 0.24 * rnd(i + 91), ex = Math.cos(a) * r, ey = Math.sin(a) * r, rx = 0.03 + 0.03 * rnd(i + 92), ry = 0.014 + 0.01 * rnd(i + 93);
    crypt.moveTo(ex + rx * Math.cos(a), ey + rx * Math.sin(a)); crypt.ellipse(ex, ey, rx, ry, a, 0, TAU);
  }
  for (const r of [0.79, 0.86, 0.92]) for (let s = 0; s < 5; s++) {   // contraction furrows near the rim
    const a0 = s * TAU / 5 + rnd(r * 40 + s) * 0.9, len = 0.5 + 0.5 * rnd(r * 70 + s);
    furrow.moveTo(Math.cos(a0) * r, Math.sin(a0) * r); furrow.arc(0, 0, r, a0, a0 + len);
  }
  return {fib, inner, coll, crypt, furrow};
})();
const VEINS = (() => {   // sclera veins from both corners, eye half width = 1
  const p = new Path2D();
  for (let v = 0; v < 8; v++) {
    const side = v % 2 ? 1 : -1; let px = side * 0.97, py = (rnd(v + 200) - 0.5) * 0.18;
    p.moveTo(px, py);
    for (let s = 0; s < 6; s++) { px -= side * (0.06 + 0.03 * rnd(v * 9 + s)); py += (rnd(v * 7 + s + 300) - 0.5) * 0.07; p.lineTo(px, py); }
  }
  return p;
})();
const HOLES = Array.from({length: 26}, (_, i) => {   // pickleball holes: evenly spread on the unit sphere
  const y = 1 - 2 * (i + 0.5) / 26, r = Math.sqrt(1 - y * y), f = i * 2.39996;
  return [Math.cos(f) * r, y, Math.sin(f) * r];
});

// ---------- the eye ----------
const bz = (P, u) => { const v = 1 - u; return [0, 1].map(i => v * v * v * P[0][i] + 3 * v * v * u * P[1][i] + 3 * v * u * u * P[2][i] + u * u * u * P[3][i]); };
const bzd = (P, u) => { const v = 1 - u; return [0, 1].map(i => 3 * v * v * (P[1][i] - P[0][i]) + 6 * v * u * (P[2][i] - P[1][i]) + 3 * u * u * (P[3][i] - P[2][i])); };
function lids(ew, eh, b) {   // inner corner on the left, a little low; the upper lid peaks towards the nose
  const I = [-ew, 0.06 * eh], O = [ew, -0.05 * eh];
  return {I, O, up: [I, [-0.5 * ew, -1.36 * b], [0.38 * ew, -1.3 * b], O], lo: [O, [0.5 * ew, 1.08 * b], [-0.42 * ew, 1.16 * b], I]};
}
function eyePath(L, dy = 0) {
  x.beginPath(); x.moveTo(L.I[0], L.I[1] + dy);
  x.bezierCurveTo(L.up[1][0], L.up[1][1] + dy, L.up[2][0], L.up[2][1] + dy, L.O[0], L.O[1] + dy);
  x.bezierCurveTo(L.lo[1][0], L.lo[1][1] + dy, L.lo[2][0], L.lo[2][1] + dy, L.I[0], L.I[1] + dy);
  x.closePath();
}
function curve(P, dy = 0, move = true) {
  if (move) x.moveTo(P[0][0], P[0][1] + dy);
  x.bezierCurveTo(P[1][0], P[1][1] + dy, P[2][0], P[2][1] + dy, P[3][0], P[3][1] + dy);
}
function lashes(P, n, len, flare, seed) {   // n lashes along the lid curve P, curling out along its normal
  x.beginPath();
  for (let i = 0; i < n; i++) {
    const u = 0.05 + 0.9 * (i + 0.5 * rnd(seed + i)) / n, p = bz(P, u), d = bzd(P, u), m = Math.hypot(d[0], d[1]) || 1;
    const tx = d[0] / m, ty = d[1] / m, nx = ty, ny = -tx;   // normal pointing away from the eye
    const L = len * (0.55 + 0.45 * Math.pow(Math.sin(Math.PI * u), 0.6)) * (0.8 + 0.4 * rnd(seed + i + 99));
    const fl = (u - 0.42) * flare;   // lashes fan out towards the corners
    x.moveTo(p[0], p[1]);
    x.quadraticCurveTo(p[0] + nx * L * 0.6, p[1] + ny * L * 0.6, p[0] + (nx + tx * fl) * L, p[1] + (ny + ty * fl) * L - Math.abs(ny) * L * 0.08);
  }
}
function drawEye(t, ew, eh, open, fade, pr, look, sc) {   // drawn around (0,0); sc = camera scale, for blur sizes
  const b = eh * open, L = lids(ew, eh, b), ir = eh * 0.92;
  // deep in the dive the lids are off screen: skip them and their shadow (the costliest parts of a frame)
  const lidsOn = 0.8 * b * sc < H * 0.6, shA = 0.9 * cl((2 - sc) / 0.6);
  // topographic contours of the face around the eye, rippling outwards as it opens
  x.globalCompositeOperation = "lighter";
  for (let k = 5; k >= 1 && lidsOn; k--) {
    const ap = outCubic((t - T_OPEN - 0.07 * k) / 0.6) * fade; if (ap <= 0) continue;
    const br = 1 + 0.01 * Math.sin(t * 2.4 + k);
    eyePath(lids(ew * (1 + 0.1 * k) * br, eh, b * (1 + 0.24 * k) * br + eh * 0.16 * k));
    x.strokeStyle = rgb(k % 2 ? CY : AM, 0.34 * Math.pow(1 - k / 6, 1.1) * ap); x.lineWidth = 1; x.stroke();
  }
  x.globalCompositeOperation = "source-over";
  // upper lid volume between the crease and the lid margin, lower lid band under the eye
  const cr = [[-0.93 * ew, 0.02 * eh], [-0.45 * ew, -eh * (1.0 + 0.55 * open)], [0.42 * ew, -eh * (0.95 + 0.55 * open)], [0.97 * ew, -0.08 * eh]];
  x.globalAlpha = fade;
  let g;
  if (lidsOn) {
  x.beginPath(); curve(cr); x.lineTo(L.O[0], L.O[1]); x.bezierCurveTo(L.up[2][0], L.up[2][1], L.up[1][0], L.up[1][1], L.I[0], L.I[1]); x.closePath();
  g = x.createLinearGradient(0, -eh * 1.6, 0, b * -0.4);
  g.addColorStop(0, "rgba(22,52,80,.55)"); g.addColorStop(0.55, "rgba(12,30,48,.8)"); g.addColorStop(1, "rgba(3,8,14,.95)");
  x.fillStyle = g; x.fill();
  g = x.createRadialGradient(-0.1 * ew, -eh * (0.75 + 0.4 * open), 0, -0.1 * ew, -eh * (0.75 + 0.4 * open), ew * 0.6);
  g.addColorStop(0, "rgba(120,220,255,.14)"); g.addColorStop(1, "rgba(120,220,255,0)");
  x.fillStyle = g; x.fill();
  x.beginPath(); curve(cr); x.strokeStyle = rgb(CY, 0.38); x.lineWidth = 1.2; x.stroke();   // the crease
  const lw = [[0.97 * ew, 0.0], [0.45 * ew, eh * (0.95 + 0.35 * open)], [-0.45 * ew, eh * (1.0 + 0.35 * open)], [-0.95 * ew, 0.14 * eh]];
  x.beginPath(); curve(L.lo); curve(lw.slice().reverse(), 0, false); x.closePath();
  g = x.createLinearGradient(0, 0, 0, eh * 1.3); g.addColorStop(0, "rgba(10,26,42,.85)"); g.addColorStop(1, "rgba(10,26,42,0)");
  x.fillStyle = g; x.fill();
  x.beginPath(); curve(lw); x.strokeStyle = rgb(CY, 0.14); x.lineWidth = 1; x.stroke();
  }

  if (bgA > 0) { x.fillStyle = `rgba(4,8,15,${bgA})`; x.fillRect(0, 0, W, H); }
  const ew = Math.min(W * (W < 700 ? 0.4 : 0.27), H * 0.62), eh = ew * 0.46;
  const open = 0.025 + 0.975 * inOutCubic((t - T_OPEN) / (T_OPEN1 - T_OPEN));
  const pr = eh * 0.92 * (0.36 + 0.1 * inOutCubic((t - 0.72) / 0.32));   // the pupil widens just before the dive
  const gl = outExpo((t - 0.5) / 0.09) - outExpo((t - 0.8) / 0.09), look = [ew * 0.075 * gl, -eh * 0.04 * gl];   // a glance aside and back
  const zk = cl((t - T_ZOOM) / (T_ZOOM1 - T_ZOOM)), half = Math.hypot(W, H) / 2;
  const s = mix(0.9, 1, outCubic(t / 1.1)) * Math.exp(Math.log(half / pr * 1.4) * inOutCubic(zk));   // slow push-in, then the dive on a log scale
  const fade = cl((1.05 - pr * s / half) / 0.5);
  if (fade > 0) {
    x.save(); x.setTransform(dpr * s, 0, 0, dpr * s, dpr * cx, dpr * cy); drawEye(t, ew, eh, open, fade, pr, look, s); x.restore();
    const sr = Math.pow(s, 1.35);   // the scope ring is nearer the camera, so it flies past faster
    x.save(); x.setTransform(dpr * sr, 0, 0, dpr * sr, dpr * cx, dpr * cy); drawReticle(t, ew * 1.2, fade * (1 - cl((sr - 2) / 2))); x.restore();
  }
  const T = targets(), clipR = zk < 1 ? pr * s : 0;
  if (zk > 0) {   // the vortex is seen through the pupil, which grows until it is the whole screen
    x.save(); if (clipR) { x.beginPath(); x.arc(cx, cy, clipR, 0, TAU); x.clip(); }
    drawTunnel(t, cx, cy, cl(zk * 2.5) * bgA);
    const fl = T.filter(b => t >= b.t0 && t < b.at).map(b => ({b, p: ballAt(b, t)})).sort((p, q) => p.p.s - q.p.s);
    for (const {b, p} of fl) {
      drawTrail(b, t, p);
      const spun = b.spin * (1 - Math.pow(1 - p.k, 2)) * 2.2;   // spins fast in flight, settles as it lands
      drawBall(p.x, p.y, p.r, spun, b.tilt, cl((p.k - 0.02) / 0.08), b.kind === "pass" ? 1 : 1 - cl((p.k - 0.86) / 0.12));
    }
    x.restore();
  }
  for (const b of T) {
    if (b.kind === "none" || b.kind === "pass") continue;
    reveal(b, t < b.at ? (b.kind === "box" || b.kind === "pill" ? 0 : {}) : drawLanded(b, t - b.at));
  }
}

// ---------- playback ----------
let tNow = 0, playing = false, last = null, raf = 0, rate = 1, shown = false;
const hooks = {onTime: null};
function show(on) {
  if (on === shown) return; shown = on;
  intro.style.display = on ? "" : "none"; intro.style.opacity = "";
  intro.style.background = on ? "none" : "";   // the canvas paints the ground from now on (and lifts it at the end)
  document.documentElement.classList.toggle("intro-on", on);
  if (!on) for (const b of tg || []) if (b.el) { b.el.style.opacity = ""; b.el.style.clipPath = ""; }
}
function seek(t) {
  tNow = cl(t, 0, T_END);
  if (tNow >= T_END) show(false); else { show(true); draw(tNow); }
  hooks.onTime && hooks.onTime(tNow, playing);
}
function loop(now) {
  raf = 0; if (!playing) return;
  if (last != null) tNow += (now - last) / 1000 * rate;
  last = now; seek(tNow);
  if (tNow >= T_END) { playing = false; hooks.onTime && hooks.onTime(tNow, false); if (!DEMO) finish(); return; }
  raf = requestAnimationFrame(loop);
}
function play() { if (tNow >= T_END) tNow = 0; intro.classList.add("go"); playing = true; last = null; if (!raf) raf = requestAnimationFrame(loop); hooks.onTime && hooks.onTime(tNow, true); }
function pause() { playing = false; last = null; hooks.onTime && hooks.onTime(tNow, false); }
function finish() {   // the real page only: tear the intro down for good
  show(false); cancelAnimationFrame(raf); removeEventListener("resize", size);
  for (const ev of ["pointerdown", "keydown"]) removeEventListener(ev, skip, true);
  intro.remove();
}
function skip(e) {
  if (!shown || (DEMO && e.target.closest && e.target.closest("#demoBar"))) return;
  e.preventDefault();
  if (DEMO) { pause(); seek(T_END); return; }
  if (skip.on) return; skip.on = true; playing = false;
  intro.animate([{opacity: 1}, {opacity: 0}], {duration: 220, easing: "ease-out", fill: "forwards"}).finished.then(finish, finish);
}
for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, skip, true);
addEventListener("resize", () => { if (shown && !playing) draw(tNow); });
window.__intro = {seek, play, pause, hooks, T_END, get t() { return tNow; }, get playing() { return playing; }, set rate(v) { rate = v; }};

// ---------- start once the page is ready ----------
// Until then the closed eye holds still with a loading line under it. Waits for the page load, the fonts (they move the
// targets), the landing, the background video and a few smooth frames, after drawing every phase once off screen to warm up.
// Capped at 8 s: a slow network delays the intro, never blocks it.
const sleep = ms => new Promise(r => setTimeout(r, ms));
const when = (ok, el, evs) => new Promise(r => { if (ok()) return r(); for (const e of evs) el.addEventListener(e, r, {once: true}); });
const poll = ok => new Promise(r => { const f = () => ok() ? r() : setTimeout(f, 50); f(); });
const calm = () => new Promise(r => { let last = 0, n = 0, k = 0;   // 3 frames in a row under 24 ms, or 1 s
  const f = now => { n = last && now - last < 24 ? n + 1 : 0; last = now; n >= 3 || ++k > 60 ? r() : requestAnimationFrame(f); };
  requestAnimationFrame(f); });
async function ready() {
  await when(() => document.readyState === "complete", window, ["load"]);
  if (document.fonts) await document.fonts.ready;
  const land = () => document.getElementById("landing");
  await Promise.race([poll(() => land() && !land().hidden), sleep(2000)]);
  const v = document.getElementById("bgVid");
  // the video's first frames hitch the page: let it get going before the intro does (3 s at most, e.g. autoplay blocked)
  if (v && v.src) await Promise.race([when(() => (!v.paused && v.readyState >= 3) || !!v.error, v, ["playing", "error"]), sleep(3000)]);
  await warm();
  await calm();
}
async function warm() {   // draw every phase once, one per frame, on a canvas hidden under the real one: the GPU prepares
  // its shaders now instead of stalling mid-intro (draws thrown away in the same frame would never reach it)
  if (!shown || playing) return;
  const w = document.createElement("canvas"), keep = x;
  w.width = cv.width; w.height = cv.height; w.style.cssText = "position:absolute;inset:0;width:100%;height:100%";
  intro.insertBefore(w, cv); x = w.getContext("2d");
  for (const t of [0.45, 0.7, 1.1, 1.3, 1.5, 1.65, 1.9, 2.4, 2.85, 3.05, 3.3, 3.6]) {
    if (!shown || playing) break;
    draw(t); await new Promise(r => requestAnimationFrame(r));
  }
  x = keep; w.remove();
  if (shown && !playing) seek(0);   // puts the page's parts back to hidden
}
seek(0);
Promise.race([ready(), sleep(8000)]).then(() => { if (shown && !playing && tNow === 0) play(); });
})();

// landing background video, as on the real page
(() => {
  const bg = document.getElementById("bgVid");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  bg.addEventListener("playing", () => document.getElementById("landing").classList.add("has-bg"), {once: true});
  bg.muted = true; bg.src = "bg.mp4"; bg.play().catch(() => {});
})();

// demo controls
(() => {
  const I = window.__intro, $ = id => document.getElementById(id);
  const seekEl = $("dSeek"), tm = $("dTime"), pz = $("dPause");
  seekEl.max = I.T_END;
  I.hooks.onTime = (t, playing) => {
    seekEl.value = t; tm.textContent = `${t.toFixed(2)} / ${I.T_END.toFixed(1)} s`;
    pz.textContent = playing ? "Tạm dừng" : "Tiếp tục"; pz.disabled = !playing && t >= I.T_END;
  };
  $("dReplay").addEventListener("click", () => { I.seek(0); I.play(); });
  pz.addEventListener("click", () => I.playing ? I.pause() : I.play());
  seekEl.addEventListener("input", () => { I.pause(); I.seek(+seekEl.value); });
  $("dRate").addEventListener("change", e => { I.rate = +e.target.value; });
  I.hooks.onTime(I.t, I.playing);
})();
</script>
